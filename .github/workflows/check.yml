name: check

# Every PR is checked against the branch it targets; every push to staging
# (merges, and the maintainer's pipeline commits) is checked whole. Labels are
# part of the input — `retime` and `maintainer` lift diff rules — so adding or
# removing one re-runs the check.
on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [staging]

# Plain `pull_request`, never `pull_request_target`: a fork's code runs with a
# read-only token and no secrets, and this workflow needs nothing more.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff needs the base branch's history

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-python@v5 # tools/lint_vtt.py, stdlib only
        with:
          python-version: "3.12"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      - name: Check the corpus and this PR's changes
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bun run check --changed "$BASE" --allow "$LABELS"

      - name: Check the corpus
        if: github.event_name == 'push'
        run: bun run check --no-asr
