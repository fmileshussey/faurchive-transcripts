name: New transcript
description: Claim a lecture to transcribe — one already catalogued, or a recording held elsewhere (Yafe Beito, a tape, another site).
title: "[new transcript] "
labels: [new-transcript]
body:
  - type: markdown
    attributes:
      value: |
        Claiming a lecture here stops two people doing the same work.
        Catalogued lectures still to transcribe are the rows in `catalog.json` with `"transcribed": false`.
        A recording that isn't catalogued yet you catalogue yourself, in the same pull request as the transcript — see CONTRIBUTING.md §5.
  - type: input
    id: lecture
    attributes:
      label: Catalog id, if it's already catalogued
      placeholder: aboda-zara-7-11-10
  - type: input
    id: source
    attributes:
      label: Otherwise, where the recording is
      description: The archive and its number for it, and a link if there is one.
      placeholder: Yafe Beito 1192 — https://yafebeito.s3.amazonaws.com/classes/1192.mp3
  - type: textarea
    id: about
    attributes:
      label: Anything else you know
      description: Title, date (and how you know it), subject, length, who recorded it.
  - type: dropdown
    id: how
    attributes:
      label: How will you produce it?
      options:
        - By hand, listening
        - Speech recognition, then corrected by listening
        - Speech recognition only (needs listening before merge)
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Format
      options:
        - label: I've read docs/FORMAT.md — one line per cue, no cue ids, `[inaudible]` for what I can't hear
          required: true
        - label: I searched the catalog for this lecture under other titles
          required: true
