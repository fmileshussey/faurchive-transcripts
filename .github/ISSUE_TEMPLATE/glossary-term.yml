name: Glossary term
description: Propose a new terms.json entry, or a change to one.
title: "[glossary] "
labels: [glossary]
body:
  - type: markdown
    attributes:
      value: |
        Read docs/GLOSSARY.md first. A `translit` variant is rewritten into **every** transcript, blind to context —
        so the evidence below matters more than anything else in this form.
  - type: input
    id: canonical
    attributes:
      label: Canonical form (his pronunciation)
      placeholder: Yiṣḥaq
    validations:
      required: true
  - type: textarea
    id: variants
    attributes:
      label: Variants
      description: Which go in `translit` (spellings of the same word, rewritten) and which in `en` (glosses, names, phrases — search only)?
      placeholder: |
        translit: ishaq, yitzhak
        en: Isaac
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: For each translit variant, how many times it occurs in transcripts/ and whether every occurrence is this word. Name any that aren't.
    validations:
      required: true
