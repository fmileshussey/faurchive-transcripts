name: Tooling or docs problem
description: The checker, the tests, or the documentation is wrong or unclear.
title: "[tooling] "
labels: [tooling]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and its output, or the doc and what's wrong with it.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
